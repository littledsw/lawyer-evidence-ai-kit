[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-kit"
version = "0.1.0"
description = "证据目录 + 证据册 PDF 生成器（劳动仲裁/诉讼通用，本地运行）"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pypdf>=5.0",
    "pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evidence-kit = "evidence_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
